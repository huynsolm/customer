<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카페 재고</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mut:#6b6b70; --line:#e2e2e6; --acc:#2a6df4; --bad:#c62828; --warn:#fff3e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#ececf0; --mut:#9a9aa3; --line:#34343b; --acc:#6c9bff; --bad:#ff6b6b; --warn:#3a2d17; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  nav button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  button, input, select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .low { background:var(--warn); }
  .mut { color:var(--mut); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  #err { color:var(--bad); min-height:1.5em; }
  .tag { font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:99px; }
  .scroll { overflow-x:auto; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .panel p { margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1>카페 재고</h1>
  <div class="row" id="who">
    <label>매장 <select id="store"></select></label> <button id="addStore">매장 추가</button>
    <label>작업자 <input id="actor" maxlength="30" placeholder="이름" style="width:110px"></label>
    <span class="mut">기록마다 작업자 이름이 남습니다(로그인 없음).</span>
  </div>
  <nav>
    <button data-v="stock" class="on">재고 목록</button>
    <button data-v="po">발주·입고</button>
    <button data-v="hist">변동 이력</button>
  </nav>
  <div id="err" role="alert"></div>
  <div id="pending" class="panel" hidden>결과를 확인하지 못한 요청 <b id="pendingN"></b>건이 있습니다.
    <button id="resend">같은 내용으로 다시 보내기</button> <span class="mut">이미 반영된 요청은 중복으로 반영되지 않습니다.
    같은 내용으로 작업을 한 번 더 하려면, 먼저 다시 보내기로 결과를 확인하세요.</span>
    <p id="pendingWarn" hidden>이 브라우저는 저장소를 쓸 수 없어, 새로고침하면 이 요청을 복구할 수 없습니다.</p></div>
  <section id="view"></section>
</main>
<script src="client.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => crypto.randomUUID();
let view = 'stock', histItem = null, items = [], stores = [], store = 1;
const pref = {  // 마지막 선택을 기억한다. 저장소를 쓸 수 없으면 기억만 못 할 뿐 동작은 같다.
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
store = +pref.get('store') || 1;
const actor = () => {
  const a = $('#actor').value.trim();
  if (!a) throw new Error('작업자 이름을 먼저 입력하세요');
  return a;
};

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', body:JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}

// 요청 키·재전송·정수 입력 처리는 client.js에 있다(Node 테스트: test_client.mjs).
const sender = createSender({
  fetch: (...a) => fetch(...a),
  storage: (() => { try { return sessionStorage; } catch { return null; } })(),
  uid,
  actor,
  onChange: updatePending,
});
const send = sender.send;
function updatePending() {
  const n = sender.unresolved();
  $('#pending').hidden = !n;
  $('#pendingN').textContent = n;
  $('#pendingWarn').hidden = sender.persisted();
}

const show = e => { $('#err').textContent = e ? e.message : ''; };
async function act(fn) { try { show(); await fn(); await render(); } catch (e) { show(e); } }

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  show(); render().catch(show);
});

// 더블클릭 등으로 다시 그리기가 겹치면 화면이 비거나 옛 데이터로 덮일 수 있어 순서대로 실행한다.
let queue = Promise.resolve();
function render() {
  return queue = queue.catch(() => {}).then(async () => {
    // 조회 중에 매장이 바뀌면 이 렌더 결과는 버린다(바뀐 매장의 렌더가 이어서 실행된다).
    // 그러지 않으면 이전 매장의 품목 행에 새 매장의 정보가 섞이고, 그 행의 버튼이 다른 매장 품목에 기록한다.
    let st = store;
    stores = await api('/api/stores');
    if (!stores.some(s => s.id === st)) store = st = stores[0].id;
    if (st !== store) return;
    $('#store').innerHTML = stores.map(s => `<option value="${s.id}" ${s.id === st ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
    const list = await api('/api/items?store=' + st);
    if (st !== store) return;
    items = list;
    await ({stock: vStock, po: vPo, hist: vHist})[view](st);
    updatePending();
  });
}

function itemOptions(sel) {
  return items.map(i => `<option value="${i.id}" ${i.id == sel ? 'selected' : ''}>${esc(i.name)}</option>`).join('');
}

async function vStock(st) {
  const sh = await api('/api/shortage?store=' + st);
  if (st !== store) return;
  const by = Object.fromEntries(sh.rows.map(r => [r.item_id, r]));
  $('#view').innerHTML = `<div class="panel row" id="newitem"><b>품목 추가</b>
      <input id="nn" placeholder="이름" maxlength="50" style="width:120px"> <input id="nu" placeholder="단위(개·kg)" maxlength="50" style="width:100px">
      <input id="nr" type="number" min="0" placeholder="발주 기준" style="width:90px"> <input id="no" type="number" min="0" placeholder="기초 재고" style="width:90px">
      <button id="nadd">추가</button></div>
    <div class="panel"><b>부족 품목 요약</b> <span class="tag" id="src">계산</span>
      <p id="sum">${esc(sh.summary)}</p>
      <button id="ai">AI로 다시 쓰기</button> <span class="mut" id="ainote"></span></div>
    <div class="scroll"><table>
    <tr><th>품목</th><th class="num">현재고</th><th class="num">발주 기준</th><th class="num">남은 일수</th><th class="num">권장 발주</th><th>사용·폐기 / 마감</th><th></th></tr>
    ${items.map(i => { const r = by[i.id]; return `<tr class="${r.short ? 'low' : ''}" data-id="${i.id}" data-key="${uid()}">
      <td>${esc(i.name)} ${r.short ? '<span class="tag">부족</span>' : ''} <button data-a="edit">수정</button></td>
      <td class="num">${i.stock} ${esc(i.unit)}${r.incoming ? `<br><span class="mut">+${r.incoming} 입고 예정</span>` : ''}</td><td class="num">${i.reorder_point}</td>
      <td class="num">${r.days_left ?? '-'}</td>
      <td class="num">${r.suggested_qty ? `${r.suggested_qty} <button data-a="order" data-q="${r.suggested_qty}">발주</button>` : '-'}</td>
      <td><input type="number" min="1" class="q" style="width:70px" aria-label="${esc(i.name)} 수량">
        <button data-a="use">사용</button> <button data-a="waste">폐기</button></td>
      <td><input type="number" min="0" class="c" style="width:70px" aria-label="${esc(i.name)} 실사 수량">
        <button data-a="count">마감</button></td></tr>`; }).join('')}
  </table></div>
  <p class="mut">남은 일수·권장 발주는 최근 7일 사용량 기준(가정: 일주일분 + 발주 기준). 사용·폐기·마감은 모두 이력에 남고, 같은 버튼을 두 번 눌러도 한 번만 반영됩니다.</p>`;
  $('#nadd').onclick = () => act(async () => {
    await send('/api/items', {store_id:st, name:$('#nn').value.trim(), unit:$('#nu').value.trim(),
      reorder_point:intOf($('#nr').value || '0', 0, '발주 기준'), opening:intOf($('#no').value || '0', 0, '기초 재고')});
  });
  $('#ai').onclick = async () => {
    // 응답을 기다리는 동안 화면을 옮기면 이 노드들은 사라진다. 그때 온 응답은 무시한다.
    const [btn, sum, src, note] = ['#ai', '#sum', '#src', '#ainote'].map(s => $(s));
    btn.disabled = true; note.textContent = '요약 중…';
    try {
      const r = await api('/api/shortage/ai?store=' + st, {});
      if (st !== store || !sum.isConnected) return;
      sum.textContent = r.summary;
      src.textContent = r.source === 'openai' ? 'ChatGPT' : '계산';
      note.textContent = r.note;
    } catch (e) {
      if (st !== store || !sum.isConnected) return;
      show(e); note.textContent = '';
    }
    btn.disabled = false;
  };
  document.querySelectorAll('#view tr[data-id]').forEach(tr => tr.querySelectorAll('button').forEach(b => b.onclick = () => act(async () => {
    const id = +tr.dataset.id;
    if (b.dataset.a === 'edit') {
      const who = actor(), it = items.find(x => x.id === id);
      const name = prompt('품목 이름', it.name); if (name === null) return;
      const rp = prompt('발주 기준 수량', it.reorder_point); if (rp === null) return;
      await api('/api/items/update', {item_id:id, name:name.trim(), reorder_point:intOf(rp, 0, '발주 기준'), actor:who});
    } else if (b.dataset.a === 'order') await send('/api/pos', {item_id:id, qty:+b.dataset.q});
    else if (b.dataset.a === 'count') await send('/api/stocktake', {item_id:id, counted:intOf($('.c', tr).value, 0, '실사 수량')});
    else await send('/api/out', {item_id:id, qty:intOf($('.q', tr).value, 1, '수량'), kind:b.dataset.a});
  })));
}

async function vPo(st) {
  const pos = await api('/api/pos?store=' + st);
  if (st !== store) return;
  $('#view').innerHTML = `<div class="row" id="newpo">
      <select id="pi">${itemOptions()}</select>
      <input id="pq" type="number" min="1" placeholder="주문 수량" style="width:110px">
      <button id="pgo">발주 등록</button></div>
    <div class="scroll"><table>
    <tr><th>번호</th><th>품목</th><th class="num">주문</th><th class="num">입고</th><th>상태</th><th>등록</th><th>입고 처리</th></tr>
    ${pos.map(p => `<tr data-id="${p.id}">
      <td>PO-${p.id}</td><td>${esc(p.item_name)}</td><td class="num">${p.ordered_qty}</td>
      <td class="num">${p.received}</td><td><span class="tag">${esc(p.status)}</span></td>
      <td class="mut">${esc(p.created_by)}</td>
      <td>${p.remaining ? `<input type="number" min="1" class="q" style="width:70px" placeholder="잔량 ${p.remaining}">
        <button data-a="rcv">입고</button> <button data-a="cancel">잔량 취소</button>` : ''}</td></tr>`).join('')}
    </table></div>`;
  $('#pgo').onclick = () => act(() => send('/api/pos', {item_id:+$('#pi').value, qty:intOf($('#pq').value, 1, '주문 수량')}));
  document.querySelectorAll('#view tr[data-id]').forEach(tr => tr.querySelectorAll('button').forEach(b => b.onclick = () => act(async () => {
    const id = tr.dataset.id;
    if (b.dataset.a === 'rcv') await send(`/api/pos/${id}/receive`, {qty:intOf($('.q', tr).value, 1, '입고 수량')});
    else {
      const reason = prompt('잔량 취소 사유'); if (reason === null) return;
      await api(`/api/pos/${id}/cancel`, {reason, actor: actor()});
    }
  })));
}

const KIND = {opening:'기초 재고', receipt:'입고', use:'사용', waste:'폐기', correction:'정정', adjustment:'마감 조정'};
async function vHist(st) {
  if (!items.length) { $('#view').innerHTML = '<p class="mut">이 매장에는 아직 품목이 없습니다. 재고 목록에서 품목을 추가하세요.</p>'; return; }
  if (!items.some(i => i.id === histItem)) histItem = items[0].id;
  const rows = await api('/api/history/' + histItem);
  if (st !== store) return;
  let run = 0;
  const body = rows.map(r => { run += r.delta; return `<tr data-id="${r.id}">
    <td>${esc(r.created_at)}</td><td>${KIND[r.kind]}</td><td class="num">${r.delta > 0 ? '+' : ''}${r.delta}</td>
    <td class="num">${run}</td><td class="mut">${esc(r.note)}</td><td class="mut">${esc(r.actor)}</td>
    <td>${['receipt','use','waste'].includes(r.kind) ? '<button>정정</button>' : ''}</td></tr>`; }).join('');
  $('#view').innerHTML = `<div class="row"><select id="hi">${itemOptions(histItem)}</select></div>
    <div class="scroll"><table><tr><th>시각</th><th>구분</th><th class="num">변동</th><th class="num">누계</th><th>비고</th><th>작업자</th><th></th></tr>${body}</table></div>
    <p class="mut">기록은 삭제하지 않습니다. 정정하면 차이만큼의 정정 기록이 추가됩니다(0 입력 = 취소).</p>`;
  $('#hi').onchange = e => { histItem = +e.target.value; render(); };
  document.querySelectorAll('#view tr[data-id] button').forEach(b => b.onclick = () => act(async () => {
    const tr = b.closest('tr');
    const q = prompt('올바른 수량(0 = 취소)'); if (q === null) return;
    const qty = intOf(q, 0, '정정 수량');
    const reason = prompt('정정 사유'); if (reason === null) return;
    await send('/api/correct', {movement_id:+tr.dataset.id, qty, reason});
  }));
}
$('#resend').onclick = () => act(sender.resend);
$('#actor').value = pref.get('actor') || '';
$('#actor').onchange = e => pref.set('actor', e.target.value.trim());
$('#store').onchange = e => { store = +e.target.value; pref.set('store', store); histItem = null; show(); render().catch(show); };
$('#addStore').onclick = () => act(async () => {
  const name = prompt('새 매장 이름'); if (name === null) return;
  store = (await send('/api/stores', {name: name.trim()})).id;
  pref.set('store', store); histItem = null;
});
render().catch(show);
</script>
</body>
</html>
